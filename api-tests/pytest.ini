[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v
markers =
    smoke: main-path smoke cases
    negative: negative / exception cases
    ai: AI application cases (hallucination, refusal, prompt injection)
filterwarnings =
    ignore::DeprecationWarning

; Generate HTML report (requires pytest-html; kept out of addopts so the suite
; still runs when the plugin is not installed):
;   pytest --html=reports/report.html --self-contained-html
;
; NOTE: keep this file ASCII-only. iniconfig reads it with the system locale
; encoding, so non-ASCII comments break pytest on Windows (GBK) machines.
