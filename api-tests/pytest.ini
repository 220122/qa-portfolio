[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v
markers =
    smoke: 主干冒烟用例
    negative: 负向/异常用例
    ai: AI 应用专项（幻觉、拒答、注入）
filterwarnings =
    ignore::DeprecationWarning

# 生成 HTML 报告（需先装 pytest-html，单独执行，不放进 addopts，避免没装插件时整套跑不起来）：
#   pytest --html=reports/report.html --self-contained-html
